<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relevé MT — Grands comptes</title>
<meta name="description" content="Relevé mensuel des compteurs Moyenne Tension (grands comptes) : 22 cadrans, historique des index, calcul automatique des consommations et export Excel au format RELEVE MT.">
<meta name="application-name" content="Relevé MT">
<meta name="theme-color" content="#0E5A8A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1D28" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Relevé MT">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* ===================== Relevé MT — styles ===================== */
:root {
  --bar-bg: #0E5A8A; --bar-fg: #FFFFFF;
  --primary: #0E5A8A; --primary-hover: #0B4B74; --primary-soft: #E3EEF7; --on-primary: #FFFFFF;
  --accent: #F2A516; --on-accent: #1E1500;
  --bg: #EDF1F5; --surface: #FFFFFF; --surface-2: #F5F7FA; --line: #D9E0E7; --line-strong: #BFCAD4;
  --text: #122230; --muted: #566877; --faint: #83929F;
  --ok: #137748; --ok-soft: #DFF2E7;
  --warn: #945B00; --warn-soft: #FFF0D2;
  --danger: #BC3127; --danger-soft: #FCE6E3;
  --phase: #F3EEFA; --phase-line: #DCCFEF;
  --g-eai: #0E5A8A; --g-eri: #7A4DB2; --g-eae: #15804B; --g-hu: #687684; --g-pai: #C2561A;
  --ring: 0 0 0 3px rgba(242, 165, 22, .45);
  --shadow: 0 1px 2px rgba(15, 35, 50, .06), 0 6px 18px rgba(15, 35, 50, .06);
  --radius: 16px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Roboto Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bar-bg: #0F1D28; --bar-fg: #E6EDF3;
    --primary: #5AAEE6; --primary-hover: #77BDEC; --primary-soft: #15324A; --on-primary: #06131D;
    --accent: #F5B53A; --on-accent: #1E1500;
    --bg: #0A1117; --surface: #121D26; --surface-2: #17242F; --line: #233340; --line-strong: #33475A;
    --text: #E6EDF3; --muted: #9EB0BF; --faint: #6F8494;
    --ok: #4CC38A; --ok-soft: #10301F;
    --warn: #F0B34A; --warn-soft: #33260C;
    --danger: #F07167; --danger-soft: #3B1714;
    --phase: #201A2E; --phase-line: #3A2E52;
    --g-eai: #5AAEE6; --g-eri: #B393E6; --g-eae: #4CC38A; --g-hu: #A5B3C0; --g-pai: #F29A5C;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh;
  background: var(--bg); color: var(--text);
  font: 16px/1.45 var(--font); -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--primary); }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: none; box-shadow: var(--ring); }
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* ---------- Démarrage ---------- */
.boot { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 14px; color: var(--muted); }
.boot-logo { width: 64px; height: 64px; border-radius: 18px; background: var(--bar-bg); color: var(--accent); display: grid; place-items: center; }
.boot-logo .ic { width: 34px; height: 34px; }

/* ---------- Barre d'application ---------- */
.appbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 4px;
  min-height: 60px; padding: 8px 6px 8px 14px; padding-top: max(8px, env(safe-area-inset-top));
  background: var(--bar-bg); color: var(--bar-fg);
  box-shadow: 0 1px 0 rgba(0, 0, 0, .1), 0 4px 14px rgba(8, 30, 48, .12);
}
.appbar.sub { padding-left: 4px; }
.brand { flex: 1; min-width: 0; display: flex; align-items: center; gap: 11px; }
.brand .logo { width: 38px; height: 38px; border-radius: 11px; background: rgba(255, 255, 255, .13); color: var(--accent); display: grid; place-items: center; flex: none; }
.brand .logo .ic { width: 22px; height: 22px; }
.brand b, .appbar .title b { display: block; font-size: 17px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand small, .appbar .title small { display: block; font-size: 12.5px; opacity: .78; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.appbar .title { flex: 1; min-width: 0; padding-left: 2px; }
.icon-btn {
  display: inline-grid; place-items: center; flex: none;
  width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: inherit;
}
.icon-btn:active { background: rgba(127, 127, 127, .2); }
.icon-btn .ic { width: 22px; height: 22px; }
.appbar .save-btn {
  display: inline-flex; align-items: center; gap: 7px; height: 42px; padding: 0 14px; margin-left: 4px;
  border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 15px;
}
.appbar .save-btn .ic { width: 21px; height: 21px; }
.appbar .pill {
  display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; margin-right: 2px;
  border: 1px solid rgba(255, 255, 255, .35); border-radius: 999px; background: rgba(255, 255, 255, .1);
  color: inherit; font-weight: 600; font-size: 14px;
}
.appbar .pill .ic { width: 17px; height: 17px; }

/* ---------- Mise en page ---------- */
.page { max-width: 780px; margin: 0 auto; padding: 14px 14px calc(110px + env(safe-area-inset-bottom)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
.card.flush { padding: 0; overflow: hidden; }
.sec-title { display: flex; align-items: center; gap: 8px; margin: 22px 4px 10px; font-size: 13px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.card > h2 { font-size: 13px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.row { display: flex; align-items: center; gap: 10px; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-row > .btn { flex: 1 1 150px; }
.stack > * + * { margin-top: 10px; }
.divider { height: 1px; background: var(--line); margin: 14px 0; }

/* ---------- Boutons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 46px; padding: 0 16px; border-radius: 12px;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--text);
  font-weight: 650; font-size: 15px; text-decoration: none; text-align: center; line-height: 1.2;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.accent { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn.danger.solid { background: var(--danger); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.soft { background: var(--primary-soft); border-color: transparent; color: var(--primary); }
.btn.block { width: 100%; }
.btn.big { min-height: 56px; font-size: 16.5px; border-radius: 14px; }
.btn.sm { min-height: 38px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn .ic { width: 19px; height: 19px; }

/* ---------- Champs ---------- */
.field { display: block; margin-bottom: 14px; }
.field > span { display: block; font-size: 13.5px; font-weight: 650; color: var(--muted); margin-bottom: 6px; }
.field.req > span::after { content: " *"; color: var(--danger); }
.field small.hint { display: block; margin-top: 5px; color: var(--faint); font-size: 12.5px; }
.field small.err { display: block; margin-top: 5px; color: var(--danger); font-size: 13px; font-weight: 600; }
.inp {
  width: 100%; min-height: 48px; padding: 11px 13px;
  border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface);
  font-size: 16px; line-height: 1.3;
}
textarea.inp { resize: vertical; min-height: 76px; }
.inp:focus { outline: none; border-color: var(--primary); box-shadow: var(--ring); }
.inp.bad { border-color: var(--danger); background: var(--danger-soft); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
@media (max-width: 420px) { .grid2 { grid-template-columns: 1fr; } }
.check { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; font-size: 15px; }
.check input { width: 22px; height: 22px; margin: 1px 0 0; flex: none; accent-color: var(--primary); }
.check small { display: block; color: var(--muted); font-size: 13px; }

/* ---------- Accueil : période ---------- */
.period .per-row { display: flex; align-items: center; gap: 6px; }
.per-mid { flex: 1; text-align: center; min-width: 0; }
.per-mid small { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.per-mid b { display: block; font-size: 23px; letter-spacing: -.01em; line-height: 1.25; }
.per-mid span { display: block; font-size: 13px; color: var(--muted); }
.per-row .icon-btn { border: 1px solid var(--line); background: var(--surface-2); }
.progress { height: 10px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; margin: 14px 0 8px; }
.progress > div { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--ok), #3DBB80); transition: width .35s ease; }
.per-stats { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 14px; color: var(--muted); margin-bottom: 14px; }
.per-stats b { color: var(--text); }
.per-stats .warn-t { color: var(--warn); font-weight: 650; }
.per-stats .ok-t { color: var(--ok); font-weight: 650; }

/* ---------- Recherche, filtres, liste ---------- */
.search { position: relative; margin-bottom: 10px; }
.search > .ic { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
.search input {
  width: 100%; height: 52px; padding: 0 48px 0 46px;
  border: 1px solid var(--line-strong); border-radius: 14px; background: var(--surface); font-size: 16px;
  box-shadow: var(--shadow);
}
.search input:focus { outline: none; border-color: var(--primary); box-shadow: var(--ring); }
.search input::-webkit-search-cancel-button { display: none; }
.search .clear { position: absolute; right: 4px; top: 4px; color: var(--muted); }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; height: 38px; padding: 0 11px; border-radius: 999px;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--muted); font-weight: 650; font-size: 13.5px;
}
.chip .n { margin-left: 4px; font-variant-numeric: tabular-nums; opacity: .85; }
.chip.on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.item {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  padding: 14px 14px; border: 0; border-bottom: 1px solid var(--line); background: transparent;
}
.item:last-child { border-bottom: 0; }
.item:active { background: var(--surface-2); }
.item-main { flex: 1; min-width: 0; }
.item-main > b { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ids { display: flex; flex-wrap: wrap; gap: 2px 14px; margin-top: 3px; font-size: 13.5px; color: var(--muted); }
.ids b { color: var(--text); font-weight: 600; font-family: var(--mono); font-size: 13.5px; }
.st { flex: none; display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.st .ic { width: 14px; height: 14px; stroke-width: 3; }
.st.afaire { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.st.releve { background: var(--ok-soft); color: var(--ok); }
.st.brouillon, .st.modif { background: var(--warn-soft); color: var(--warn); }
.empty { text-align: center; padding: 34px 20px; color: var(--muted); }
.empty .big-ic { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 18px; display: grid; place-items: center; background: var(--primary-soft); color: var(--primary); }
.empty .big-ic .ic { width: 30px; height: 30px; }
.empty h3 { color: var(--text); font-size: 18px; margin-bottom: 6px; }
.empty p { margin-bottom: 16px; }

.fab {
  position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 15;
  display: inline-flex; align-items: center; gap: 8px; height: 58px; padding: 0 22px 0 18px;
  border: 0; border-radius: 18px; background: var(--primary); color: var(--on-primary);
  font-weight: 700; font-size: 16px; box-shadow: 0 10px 26px rgba(14, 90, 138, .38);
}
.fab .ic { width: 24px; height: 24px; }

/* ---------- Bandeaux ---------- */
.banner { display: flex; gap: 11px; align-items: flex-start; padding: 12px 14px; border-radius: 13px; margin-bottom: 14px; font-size: 14.5px; line-height: 1.4; }
.banner > .ic { margin-top: 1px; }
.banner b { display: block; }
.banner .btn { margin-top: 8px; }
.banner.info { background: var(--primary-soft); color: var(--text); }
.banner.info > .ic { color: var(--primary); }
.banner.warn { background: var(--warn-soft); color: var(--text); }
.banner.warn > .ic { color: var(--warn); }
.banner.danger { background: var(--danger-soft); color: var(--text); }
.banner.danger > .ic { color: var(--danger); }
.banner.ok { background: var(--ok-soft); color: var(--text); }
.banner.ok > .ic { color: var(--ok); }

/* ---------- Fiche ---------- */
.id-card h1 { font-size: 21px; line-height: 1.25; margin-bottom: 12px; overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; margin: 0; }
.kv > div { min-width: 0; }
.kv .wide { grid-column: 1 / -1; }
.kv dt { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); }
.kv dd { margin: 2px 0 0; font-size: 16px; overflow-wrap: anywhere; }
.kv dd.mono { font-size: 17px; font-weight: 600; }
.contacts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.contacts .btn { flex: 1 1 120px; }
.note-box { margin-top: 14px; padding: 11px 13px; border-radius: 12px; background: var(--surface-2); border: 1px dashed var(--line-strong); font-size: 14.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.hist { display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--line); }
.hist:last-child { border-bottom: 0; }
.hist-main { flex: 1; min-width: 0; text-align: left; border: 0; background: transparent; padding: 12px 4px 12px 14px; }
.hist-main b { display: block; font-size: 16px; }
.hist-main span { display: block; font-size: 13.5px; color: var(--muted); }
.hist-main .kpi { color: var(--text); font-variant-numeric: tabular-nums; margin-top: 3px; }
.hist .icon-btn { color: var(--primary); margin-right: 6px; }
.tag { display: inline-block; padding: 1px 7px; border-radius: 6px; font-size: 11.5px; font-weight: 700; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); vertical-align: 1px; }
.tag.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.gps { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.gps .mono { font-size: 14px; }

/* ---------- Saisie du relevé ---------- */
.idstrip .ids-big { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.idstrip .ids-big small { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); }
.idstrip .ids-big b { display: block; font-family: var(--mono); font-size: 19px; overflow-wrap: anywhere; line-height: 1.25; }
.idstrip .field { margin: 0; }
.idstrip .field.inline { display: flex; align-items: center; gap: 12px; }
.idstrip .field.inline > span { margin: 0; flex: none; }
.idstrip .field.inline .inp { min-height: 44px; padding: 8px 12px; }
.modebar { display: flex; align-items: center; gap: 10px; margin: 4px 0 6px; }
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); flex: none; }
.seg button { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-weight: 650; font-size: 14px; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.seg button .ic { width: 17px; height: 17px; }
.seg.sm button { height: 32px; padding: 0 10px; font-size: 13px; }
.count-pill { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; padding: 6px 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; }
.count-pill.full { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.grp { display: flex; align-items: center; gap: 9px; margin: 20px 2px 9px; font-size: 13px; font-weight: 750; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.grp::before { content: ""; width: 11px; height: 11px; border-radius: 3px; background: var(--g); flex: none; }
.cad { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--g); border-radius: 13px; padding: 10px 10px 11px 12px; margin-bottom: 9px; }
.cad.phase { background: var(--phase); border-color: var(--phase-line); border-left-color: var(--g); }
.cad.has-warn { border-color: var(--warn); border-left-color: var(--warn); }
.cad-h { display: flex; align-items: center; gap: 8px; min-width: 0; }
.nb { flex: none; min-width: 27px; height: 27px; padding: 0 6px; display: inline-grid; place-items: center; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12.5px; font-weight: 750; font-variant-numeric: tabular-nums; }
.code { font-family: var(--mono); font-size: 15.5px; font-weight: 700; letter-spacing: .02em; flex: none; }
.lib { flex: 1; min-width: 0; font-size: 13.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.um { flex: none; font-size: 12px; font-weight: 700; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 7px; padding: 2px 7px; }
.cad-b { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) minmax(0, .95fr); gap: 8px; margin-top: 9px; align-items: end; }
.cell { min-width: 0; }
.cell .lbl { display: block; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prec-btn {
  width: 100%; min-height: 46px; padding: 5px 8px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
  border: 1px dashed var(--line-strong); border-radius: 10px; background: var(--surface-2); text-align: left;
}
.prec-btn .pv { display: flex; align-items: center; gap: 5px; width: 100%; font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
.prec-btn .pv .ic { width: 13px; height: 13px; color: var(--faint); flex: none; }
.prec-btn small { font-size: 11px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.prec-edit { position: relative; }
.prec-edit .undo { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; color: var(--muted); }
.prec-edit input.num { padding-right: 36px; font-size: 15px; background: var(--warn-soft); }
input.num {
  width: 100%; min-height: 46px; padding: 8px 10px;
  border: 1.5px solid var(--line-strong); border-radius: 10px; background: var(--surface);
  font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; text-align: right;
}
input.num:focus { outline: none; border-color: var(--primary); box-shadow: var(--ring); }
input.num.filled { border-color: var(--primary); }
input.num.bad { border-color: var(--danger); background: var(--danger-soft); }
.dv { display: block; min-height: 46px; line-height: 46px; text-align: right; font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dv.neg { color: var(--danger); }
.dv.none, .dv.zero { color: var(--faint); font-weight: 600; }
.cad-msg { display: flex; gap: 6px; align-items: flex-start; margin-top: 8px; font-size: 13px; font-weight: 600; color: var(--warn); }
.cad-msg:empty { display: none; }
.cad-msg .ic { width: 16px; height: 16px; margin-top: 1px; }

.guide { scroll-margin-top: 72px; }
.guide .g-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; font-weight: 700; color: var(--muted); font-size: 14px; }
.g-card { text-align: center; padding: 16px 14px 14px; border-radius: 16px; border: 1px solid var(--line); border-top: 6px solid var(--g); background: var(--surface); }
.g-card.phase { background: var(--phase); border-color: var(--phase-line); border-top-color: var(--g); }
.g-n { display: inline-block; font-size: 12.5px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.g-code { font-family: var(--mono); font-size: 36px; font-weight: 750; letter-spacing: .03em; line-height: 1.2; margin: 2px 0; }
.g-lib { color: var(--muted); margin-bottom: 14px; }
.g-prec { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; font-size: 15px; }
.g-prec b { font-variant-numeric: tabular-nums; }
.g-prec .prec-edit { width: 180px; }
input.num.big { font-size: 30px; min-height: 66px; text-align: center; border-width: 2px; border-radius: 14px; }
.g-diff { margin-top: 12px; font-size: 16px; color: var(--muted); }
.g-diff .dv { display: inline; line-height: inherit; min-height: 0; font-size: 20px; color: var(--text); }
.g-diff .dv.neg { color: var(--danger); }
.g-card .cad-msg { justify-content: center; }
.g-nav { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; margin-top: 14px; }
.dots { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; margin-top: 16px; }
.dot { width: 20px; height: 20px; padding: 0; border-radius: 50%; border: 2px solid var(--line-strong); background: transparent; }
.dot.on { background: var(--ok); border-color: var(--ok); }
.dot.cur { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--primary); }

.bottom-bar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 15;
  background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -6px 20px rgba(15, 35, 50, .08);
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
}
.bottom-bar .in { max-width: 780px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.bottom-bar .bb-info { flex: 1; min-width: 0; font-size: 14px; color: var(--muted); line-height: 1.3; }
.bottom-bar .bb-info b { color: var(--text); font-size: 17px; font-variant-numeric: tabular-nums; }
.bottom-bar .btn { flex: none; min-width: 150px; }

/* ---------- Fenêtres ---------- */
.modal-wrap { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.modal-back { position: absolute; inset: 0; background: rgba(6, 16, 24, .5); animation: fade .15s ease-out; }
.modal {
  position: relative; width: 100%; max-width: 580px; max-height: 92vh; max-height: 92dvh;
  display: flex; flex-direction: column; background: var(--surface); color: var(--text);
  border-radius: 20px 20px 0 0; box-shadow: 0 -10px 40px rgba(0, 0, 0, .28); animation: up .2s ease-out;
}
@media (min-width: 640px) { .modal-wrap { align-items: center; padding: 20px; } .modal { border-radius: 20px; } }
.modal-wrap.full { padding: 0; align-items: stretch; }
.modal-wrap.full .modal { max-width: none; max-height: none; height: 100%; border-radius: 0; animation: none; }
.modal-h { display: flex; align-items: center; gap: 6px; padding: 8px 6px 8px 18px; border-bottom: 1px solid var(--line); min-height: 60px; }
.modal-h > b { flex: 1; font-size: 17.5px; line-height: 1.3; }
.modal-b { padding: 16px 18px; overflow: auto; -webkit-overflow-scrolling: touch; }
.modal-f { display: flex; gap: 10px; flex-wrap: wrap; padding: 12px 18px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
.modal-f .btn { flex: 1 1 140px; }
.modal-b p + p { margin-top: 10px; }
.modal-b ul { margin: 8px 0; padding-left: 20px; }
.modal-b li + li { margin-top: 6px; }
@keyframes up { from { transform: translateY(24px); opacity: .4; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.menu-list { list-style: none; margin: -6px 0; padding: 0; }
.menu-list button { display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 4px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; font-size: 16px; }
.menu-list li:last-child button { border-bottom: 0; }
.menu-list .ic { color: var(--primary); width: 22px; height: 22px; }
.menu-list small { display: block; color: var(--muted); font-size: 13px; }
.sel-list { border: 1px solid var(--line); border-radius: 12px; max-height: 38vh; overflow: auto; margin: 6px 0 12px; }
.sel-list label { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-bottom: 1px solid var(--line); }
.sel-list label:last-child { border-bottom: 0; }
.sel-list input { width: 21px; height: 21px; flex: none; accent-color: var(--primary); }
.sel-list span { min-width: 0; }
.sel-list b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sel-list small { color: var(--muted); font-family: var(--mono); }
.summary-list { list-style: none; margin: 8px 0 0; padding: 0; }
.summary-list li { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.summary-list li:last-child { border-bottom: 0; }
.summary-list .ic { width: 18px; height: 18px; margin-top: 1px; color: var(--warn); }
.filename { font-family: var(--mono); font-size: 13.5px; padding: 9px 11px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); overflow-wrap: anywhere; }

/* ---------- Aperçu au format Excel ---------- */
.xl-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.xl-wrap { overflow: auto; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px; -webkit-overflow-scrolling: touch; }
.xl-zoom { width: max-content; transform-origin: 0 0; }
table.xl { border-collapse: collapse; table-layout: fixed; background: #fff; color: #000; font-family: Calibri, Carlito, "Segoe UI", Arial, sans-serif; font-size: 14.67px; }
table.xl td { padding: 0 3px; white-space: nowrap; overflow: visible; vertical-align: bottom; line-height: 1.15; }

/* ---------- Toasts ---------- */
#toasts { position: fixed; left: 0; right: 0; bottom: calc(92px + env(safe-area-inset-bottom)); z-index: 70; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 12px; pointer-events: none; }
.toast {
  pointer-events: auto; display: flex; align-items: center; gap: 10px; width: 100%; max-width: 540px;
  padding: 12px 12px 12px 15px; border-radius: 14px; background: #16242F; color: #fff; font-size: 15px; line-height: 1.35;
  box-shadow: 0 12px 32px rgba(0, 0, 0, .3); animation: up .2s ease-out;
}
.toast.ok { background: #0F5C39; }
.toast.error { background: #8C2A22; }
.toast .ic { flex: none; }
.toast span { flex: 1; min-width: 0; }
.toast .t-act { flex: none; border: 0; border-radius: 10px; background: rgba(255, 255, 255, .17); color: #fff; font-weight: 700; padding: 9px 12px; font-size: 14px; }

/* ---------- Installation & paramètres ---------- */
.steps { margin: 0; padding-left: 22px; }
.steps li { margin-bottom: 9px; }
.steps li::marker { font-weight: 700; color: var(--primary); }
.checks { list-style: none; margin: 0; padding: 0; }
.checks li { display: flex; gap: 11px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.checks li:last-child { border-bottom: 0; }
.checks .ck { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; }
.checks .ck .ic { width: 14px; height: 14px; stroke-width: 3; }
.checks .ok .ck { background: var(--ok-soft); color: var(--ok); }
.checks .ko .ck { background: var(--danger-soft); color: var(--danger); }
.checks .warn .ck { background: var(--warn-soft); color: var(--warn); }
.checks small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.status-hero { display: flex; gap: 14px; align-items: center; }
.status-hero .ic-wrap { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; flex: none; background: var(--primary-soft); color: var(--primary); }
.status-hero .ic-wrap.ok { background: var(--ok-soft); color: var(--ok); }
.status-hero .ic-wrap .ic { width: 28px; height: 28px; }
.status-hero b { display: block; font-size: 17px; }
.url-box { display: flex; gap: 8px; align-items: center; }
.url-box code { flex: 1; min-width: 0; font-family: var(--mono); font-size: 13.5px; padding: 10px 11px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); overflow-wrap: anywhere; }
.set-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.set-row:last-child { border-bottom: 0; }
.set-row > div { flex: 1; min-width: 0; }
.set-row b { display: block; }
.set-row small { display: block; color: var(--muted); font-size: 13.5px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stats div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
.stats b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.stats span { font-size: 12.5px; color: var(--muted); }
.map-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.map-table td { padding: 7px 4px; border-bottom: 1px solid var(--line); }
.map-table td:first-child { font-family: var(--mono); font-weight: 700; width: 64px; }
.footer-note { text-align: center; color: var(--faint); font-size: 12.5px; margin: 18px 0 6px; }

#print-root { display: none; }
@page { size: A4 portrait; margin: 10mm; }
@media print {
  body { background: #fff; }
  #app, #modal-root, #toasts { display: none !important; }
  #print-root { display: block !important; }
  #print-root .xl-zoom { transform: none !important; zoom: .66; }
  #print-root h1 { font: 700 14px Calibri, Arial, sans-serif; margin: 0 0 8px; color: #000; }
}
</style>

<script>
(function () {
'use strict';
/* =====================================================================
   Relevé MT — Grands comptes (Moyenne Tension)
   Application web autonome : aucune donnée ne quitte l'appareil.
   Stockage : IndexedDB « releve-mt » (fiches compteurs, relevés, brouillons, réglages).
   ===================================================================== */

/* ---------- 1. Structure du fichier de référence « RELEVE MT.xlsx » ---------- */
const APP_VERSION = '1.0.0';

function debounce(fn, ms) { let t = null; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

const NF = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 3 });
const fmt = v => (isNum(v) ? NF.format(v) : '—');
const fmtSigned = v => (!isNum(v) ? '—' : v > 0 ? '+' + NF.format(v) : v < 0 ? '−' + NF.format(-v) : '0');
const inputVal = v => (isNum(v) ? String(v).replace('.', ',') : '');
// Lecture d'un nombre saisi : « 12 345,6 », « 12345.6 », « 12.345,6 »… ; null si vide, NaN si invalide.
function parseNum(raw) {
  if (raw == null) return null;
  if (typeof raw === 'number') return Number.isFinite(raw) ? raw : NaN;
  let t = String(raw).replace(/[\s  ']/g, '');
  if (!t) return null;
  const c = t.lastIndexOf(','), d = t.lastIndexOf('.');
  if (c >= 0 && d >= 0) { const k = Math.max(c, d); t = t.slice(0, k).replace(/[.,]/g, '') + '.' + t.slice(k + 1); }
  else if (c >= 0) { if (t.indexOf(',') !== c) return NaN; t = t.replace(',', '.'); }
  else if (d >= 0 && t.indexOf('.') !== d) return NaN;
  if (!/^(\d+\.?\d*|\.\d+)$/.test(t)) return NaN;
  return parseFloat(t);
}

/* Périodes : « AAAA-MM » = mois de consommation (relevé effectué début du mois suivant). */
const perOf = (y, m) => y + '-' + pad2(m);
const perParts = p => p.split('-').map(Number);
const isPer = p => /^\d{4}-(0[1-9]|1[0-2])$/.test(String(p || ''));
function addMonths(p, k) { const [y, m] = perParts(p); const t = y * 12 + m - 1 + k; return perOf(Math.floor(t / 12), (t % 12) + 1); }
// Jusqu'au 20 du mois on relève le mois précédent (relevé du 1er octobre = consommation de septembre).
function defaultPeriod(d = new Date()) { const p = perOf(d.getFullYear(), d.getMonth() + 1); return d.getDate() <= 20 ? addMonths(p, -1) : p; }
const perLabel = p => { const [y, m] = perParts(p); return cap(MONTHS[m - 1]) + ' ' + y; };
const perShort = p => { const [y, m] = perParts(p); return MONTHS_SHORT[m - 1] + ' ' + y; };
const perUpper = p => { const [y, m] = perParts(p); return MONTHS[m - 1].toUpperCase() + ' ' + y; };
const perNext = p => { const [y, m] = perParts(addMonths(p, 1)); return MONTHS[m - 1] + ' ' + y; };
const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
const fmtDate = iso => { if (!iso) return '—'; const [y, m, d] = String(iso).split('-'); return d && m && y ? d + '/' + m + '/' + y : String(iso); };
const defaultReadDate = p => (defaultPeriod() === p ? todayISO() : addMonths(p, 1) + '-01');

function lsGet(k, def) { try { const v = localStorage.getItem(LS_PREFIX + k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } }

      let rq, settled = false;
      const fail = err => { if (settled) return; settled = true; clearTimeout(timer); reject(err); };
      const timer = setTimeout(() => fail(new Error('La base de données ne répond pas')), timeoutMs);
      try { rq = indexedDB.open(DB_NAME, 1); } catch (e) { fail(e); return; }

        const db = rq.result;
        for (const s of ['fiches', 'releves', 'brouillons']) if (!db.objectStoreNames.contains(s)) db.createObjectStore(s, { keyPath: 'id' });

    const d = diffOf(rec, c.code);
    if (isNum(d) && d < 0) out.push({ code: c.code, msg: `${c.code} : l'index actuel est inférieur à l'index précédent (${fmtSigned(d)} ${c.um}).` });
  }

  const rowOf = {};

  const wrong = labels.filter(([ref, re]) => !re.test(norm(cells.get(ref) || '')));
  if (wrong.length) throw new Error('Modèle non conforme : libellés attendus en ' + wrong.map(w => w[0]).join(', ') + ' (comme dans RELEVE MT.xlsx).');

  let sheet = sheetXml;

  for (const c of CADRANS) for (const col of [colP, colA, colD]) sheet = clearCell(sheet, col + rowOf[c.code]);
  if (cells.get('E6') !== moisPrefix) sheet = putCell(sheet, CELL_MAP.mois, { t: 'inline', v: moisPrefix });
  return {
    info, sheetName: sh.getAttribute('name') || 'RELEVE MT',
    wbXml, sheetXml: sheet, printer, printerRid: pr ? pr.id : null,
    styles, theme: themePath ? await text(themePath) : null, sst,
    rowOf, colP, colA, colD, moisPrefix,

}

    span[colName(q1.c) + q1.r] = { rs: q2.r - q1.r + 1, cs: q2.c - q1.c + 1, q1, q2 };
    for (let r = q1.r; r <= q2.r; r++) for (let c = q1.c; c <= q2.c; c++) if (r !== q1.r || c !== q1.c) covered.add(colName(c) + r);
  }
  const xfOf = r => st.xfs[(cells[r] || { s: 0 }).s] || st.xfs[0] || { font: {}, border: {} };
  const bcss = b => (b ? `${BORDER_CSS[b.st] || '1px solid'} ${b.color || '#000'}` : 'none');
  let width = 0, html = '<table class="xl"><colgroup>';
  for (let c = p1.c; c <= p2.c; c++) { const w = px(colW[c] != null ? colW[c] : defW); width += w; html += `<col style="width:${w}px">`; }
  html += '</colgroup><tbody>';
  for (let r = p1.r; r <= p2.r; r++) {
    html += `<tr style="height:${Math.round(((rowH[r] || defH) * 4) / 3)}px">`;
    for (let c = p1.c; c <= p2.c; c++) {
      const cr = colName(c) + r;
      if (covered.has(cr)) continue;
      const cell = cells[cr] || { s: 0, txt: '', num: false }, xf = xfOf(cr), sp = span[cr], f = xf.font || {};
      const right = sp ? xfOf(colName(sp.q2.c) + sp.q1.r).border.right : xf.border.right;
      const bottom = sp ? xfOf(colName(sp.q1.c) + sp.q2.r).border.bottom : xf.border.bottom;
      const h = xf.h && xf.h !== 'general' ? (xf.h === 'centerContinuous' ? 'center' : xf.h) : cell.num ? 'right' : 'left';
      const va = xf.v === 'center' ? 'middle' : xf.v === 'top' ? 'top' : 'bottom';
      let css = `border-left:${bcss(xf.border.left)};border-top:${bcss(xf.border.top)};border-right:${bcss(right)};border-bottom:${bcss(bottom)};text-align:${h};vertical-align:${va};`;
      if (xf.fill) css += `background:${xf.fill};`;
      if (f.b) css += 'font-weight:700;';
      if (f.i) css += 'font-style:italic;';
      if (f.sz) css += `font-size:${((f.sz * 4) / 3).toFixed(2)}px;`;
      if (f.name) css += `font-family:${fontStack(f.name)};`;
      if (f.color && f.color !== '#000000') css += `color:${f.color};`;
      if (xf.wrap) css += 'white-space:normal;';
      html += `<td${sp ? ` rowspan="${sp.rs}" colspan="${sp.cs}"` : ''} style="${css}">${esc(cell.txt)}</td>`;
    }
    html += '</tr>';
  }
  return { html: html + '</tbody></table>', width };
}
async function previewSheet(rec, fiche) {
  const tpl = await getTemplate();
  if (!tpl.styleInfo) tpl.styleInfo = parseStyles(tpl.styles, tpl.theme);
  const sst = sstBuilder(tpl);

}

/* --- Notifications --- */
function toast(msg, type = '', opts = {}) {
  const box = $('#toasts');
  if (!box) return () => {};
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.setAttribute('role', type === 'error' ? 'alert' : 'status');
  el.innerHTML = `${icon(type === 'ok' ? 'check' : type === 'error' ? 'alert' : 'info')}<span>${esc(msg)}</span>${opts.action ? `<button type="button" class="t-act">${esc(opts.action.label)}</button>` : ''}`;
  const close = () => { if (el.parentNode) el.remove(); };
  el.addEventListener('click', e => {
    if (opts.action && e.target.closest('.t-act')) { close(); opts.action.fn(); return; }
    close();
  });
  box.appendChild(el);
  while (box.children.length > 3) box.firstChild.remove();
  const d = opts.duration != null ? opts.duration : opts.action ? 7000 : 4000;
  if (d > 0) setTimeout(close, d);
  return close;
}

/* --- Fenêtres --- */
const modals = [];
function openModal({ title, body, actions = [], full = false, onClose = null }) {
  const wrap = document.createElement('div');
  wrap.className = 'modal-wrap' + (full ? ' full' : '');
  wrap.innerHTML = `<div class="modal-back" data-close></div>
    <div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="modal-h"><b>${esc(title)}</b><button type="button" class="icon-btn" data-close aria-label="Fermer">${icon('x')}</button></div>
      <div class="modal-b">${body}</div>
      ${actions.length ? `<div class="modal-f">${actions.map((a, i) => `<button type="button" class="btn ${a.cls || ''}" data-mact="${i}"${a.hidden ? ' hidden' : ''}>${a.icon ? icon(a.icon) : ''}${esc(a.label)}</button>`).join('')}</div>` : ''}
    </div>`;
  const m = {
    el: wrap,
    closed: false,
    body: () => wrap.querySelector('.modal-b'),
    btn: i => wrap.querySelector(`[data-mact="${i}"]`),
    close() {
      if (m.closed) return;
      m.closed = true;
      wrap.remove();
      const i = modals.indexOf(m);
      if (i >= 0) modals.splice(i, 1);
      if (onClose) onClose();
    },
  };
  wrap.addEventListener('click', e => {
    if (e.target.closest('[data-close]')) { m.close(); return; }
    const b = e.target.closest('[data-mact]');
    if (b && !b.disabled) { const a = actions[+b.dataset.mact]; if (a.fn) a.fn(m, b); else m.close(); }
  });
  $('#modal-root').appendChild(wrap);
  modals.push(m);
  return m;
}
function closeModals() { while (modals.length) modals[modals.length - 1].close(); }
function confirmDialog({ title, body, ok = 'Confirmer', cancel = 'Annuler', danger = false }) {
  return new Promise(resolve => {
    let done = false;
    const finish = v => { if (!done) { done = true; resolve(v); } };
    openModal({
      title, body, onClose: () => finish(false),
      actions: [
        { label: cancel, fn: m => { finish(false); m.close(); } },
        { label: ok, cls: danger ? 'danger solid' : 'primary', fn: m => { finish(true); m.close(); } },
      ],
    });
  });
}
function errorDialog(title, err) {
  openModal({ title, body: `<div class="banner danger">${icon('alert')}<div>${esc((err && err.message) || String(err))}</div></div>`, actions: [{ label: 'Fermer', cls: 'primary' }] });
}

/* --- Fichiers : téléchargement et partage --- */
function downloadBlob(blob, name) {
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; a.rel = 'noopener'; a.style.display = 'none';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
function canShareFiles() {
  try { return !!(navigator.canShare && navigator.canShare({ files: [new File([new Uint8Array(1)], 'test.xlsx', { type: XLSX_MIME })] })); }
  catch (e) { return false; }
}
function shareFile(blob, name) { return navigator.share({ files: [new File([blob], name, { type: blob.type || XLSX_MIME })], title: name }); }
function deliver(file, what) {
  downloadBlob(file.blob, file.name);
  const share = canShareFiles() ? { label: 'Partager', fn: () => shareFile(file.blob, file.name).catch(() => {}) } : null;
  toast(`${what} : ${file.name} (dossier Téléchargements)`, 'ok', share ? { action: share, duration: 9000 } : { duration: 6000 });
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('Lien copié.', 'ok'); return; } catch (e) { /* repli ci-dessous */ }
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  toast(ok ? 'Lien copié.' : 'Copie impossible : sélectionnez le lien à la main.', ok ? 'ok' : 'error');
}

function waNumber(t) {
  let d = String(t || '').replace(/[^\d+]/g, '');
  if (d.startsWith('+')) d = d.slice(1);
  else if (d.startsWith('00')) d = d.slice(2);
  else if (/^0[5-7]\d{8}$/.test(d)) d = '212' + d.slice(1);     // numéro marocain 06 / 07 / 05
  return d.replace(/\D/g, '');
}

  if (wa.length >= 8) b.push(`<a class="btn soft" href="https://wa.me/${wa}" target="_blank" rel="noopener">${icon('chat')} WhatsApp</a>`);

async function saveFiche() {

  if (!ok) { const b = form.querySelector('.bad'); if (b) b.focus(); toast('Complétez les champs signalés en rouge.', 'error'); return; }
  const f = Object.assign({}, old || { id: uid(), createdAt: nowISO() }, data, { gps: S.formGps || null, updatedAt: nowISO() });
  const dup = findDuplicate(f);
  if (dup.sameC || dup.sameS) {
    const lines = [];
    if (dup.sameS) lines.push(`Le N° de série <b>${esc(f.serie)}</b> est déjà utilisé par <b>${esc(ficheName(dup.sameS))}</b> (contrat ${esc(dup.sameS.contrat)}).`);
    if (dup.sameC) lines.push(`Le N° de contrat <b>${esc(f.contrat)}</b> existe déjà : <b>${esc(ficheName(dup.sameC))}</b> (série ${esc(dup.sameC.serie)}).`);
    if (!(await confirmDialog({ title: 'Doublon possible', body: lines.map(l => `<p>${l}</p>`).join('') + '<p class="muted small">Enregistrer quand même cette fiche ?</p>', ok: 'Enregistrer quand même' }))) return;
  }
  if (old && normId(old.serie) !== normId(f.serie) && (S.byFiche.get(f.id) || []).length) {
    if (!(await confirmDialog({
      title: 'Changement de compteur ?',
      body: `<p>Le N° de série passe de <b>${esc(old.serie)}</b> à <b>${esc(f.serie)}</b>.</p><p>Les relevés déjà enregistrés gardent l'ancien numéro. Pour le nouveau compteur, l'index précédent repartira de 0 (modifiable pendant la saisie).</p>`,
      ok: 'Confirmer le changement',

  }
  if (!(await commit([['put', 'fiches', f]]))) return;

  const rec = { id: w.id, ficheId: w.ficheId, periode: w.periode, serie: w.serie, date: w.date || todayISO(), v: cleanV(w.v), note: w.note || '', createdAt: (w.base && w.base.createdAt) || nowISO(), savedAt: nowISO() };
  w.dirty = false;
  if (!(await commit([['put', 'releves', rec], ['del', 'brouillons', rec.id]]))) return;
  S.work = null;
  if (rec.periode === S.periode) {
    const next = nextToRead(f.id);
    toast(`Relevé enregistré — ${ficheName(f)} (${n}/22)`, 'ok', next
      ? { action: { label: 'Compteur suivant', fn: () => go(`#/releve/${encodeURIComponent(next.id)}/${S.periode}`) }, duration: 9000 }
      : { duration: 6000 });
    goHome();
  } else {
    toast(`Relevé de ${perLabel(rec.periode)} enregistré.`, 'ok');
    back('#/fiche/' + encodeURIComponent(f.id));
  }
}
async function discardDraft() {
  const w = S.work;
  if (!w) return;
  const ok = await confirmDialog({
    title: w.base ? 'Annuler les modifications ?' : 'Effacer le brouillon ?',
    body: w.base ? '<p>Le relevé revient à sa dernière version enregistrée.</p>' : '<p>Toutes les valeurs saisies pour ce mois seront effacées.</p>',
    ok: w.base ? 'Annuler les modifications' : 'Effacer', danger: true,
  });
  if (!ok) return;
  w.dirty = false;
  await commit([['del', 'brouillons', w.id]]);
  S.work = null;
  render();
  toast(w.base ? 'Modifications annulées.' : 'Brouillon effacé.', 'ok');
}

      <label class="check"><input type="checkbox" data-e="recap"${recap ? ' checked' : ''}><span><b>Ajouter une feuille « Récapitulatif »</b><small>facultatif : une ligne par contrat (index actuels et différences), après les feuilles RELEVE MT</small></span></label>
      <p class="small muted" style="margin:8px 0 4px">Nom du fichier</p><div class="filename">${esc(fileSafe(`RELEVE MT - ${perLabel(p)}`))}.xlsx</div>`;

    m.btn(0).disabled = none; m.btn(1).disabled = none;

  m.body().addEventListener('click', e => {

async function importFile(file) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  const bytes = new Uint8Array(await file.arrayBuffer());
  if (ext === 'json') return restoreBackup(bytes, file.name);
  if (ext === 'xls') throw new Error('Ancien format Excel (.xls) : ouvrez-le dans Excel, « Enregistrer sous » → « Classeur Excel (.xlsx) », puis importez ce nouveau fichier.');
  const sheets = ext === 'csv' || ext === 'txt' ? [{ name: file.name, cells: csvToCells(decodeText(bytes)) }] : await readWorkbook(bytes);
  const plan = { releves: [], fiches: [], skipped: [], blank: 0 };
  for (const sh of sheets) {
    const r = recogReleve(sh.cells);
    if (r) {
      if (!r.filled && !r.fiche.contrat && !r.fiche.serie) { plan.blank++; continue; }
      if (!r.fiche.contrat || !r.fiche.serie) { plan.skipped.push(`Feuille « ${sh.name} » : N° de contrat (${CELL_MAP.contrat}) ou N° de série (${CELL_MAP.serie}) manquant.`); continue; }
      plan.releves.push(Object.assign({ sheet: sh.name }, r));
      continue;
    }
    const l = recogList(sh.cells);
    if (l) { plan.fiches.push(...l.fiches); plan.skipped.push(...l.skipped.map(s => `Feuille « ${sh.name} », ${s}.`)); continue; }
    if (sh.cells.size) plan.skipped.push(`Feuille « ${sh.name} » : format non reconnu (ni feuille RELEVE MT, ni liste avec colonnes « N° contrat » et « N° série »).`);
  }
  showImportPlan(plan, file.name);
}
const ficheKey = f => normId(f.contrat) + '|' + normId(f.serie);

      </ul>

      ${plan.releves.length ? `<label class="check"><input type="checkbox" data-i="replace"><span><b>Remplacer les relevés déjà présents</b><small data-i="clash">pour le même compteur et le même mois (sinon ils sont conservés)</small></span></label>` : ''}
      ${oldF ? `<label class="check"><input type="checkbox" data-i="overwrite"><span><b>Mettre à jour les fiches existantes</b><small>sinon, seules les informations manquantes sont complétées</small></span></label>` : ''}
      ${skippedHTML}`,
    actions: [{ label: 'Annuler' }, { label: 'Importer', cls: 'primary', icon: 'upload', fn: async mm => {

      mm.close();
      try {
        const r = await applyImport(plan, { periode: per, replace: !!(q('[data-i="replace"]') && q('[data-i="replace"]').checked), overwrite: !!(q('[data-i="overwrite"]') && q('[data-i="overwrite"]').checked) });
        const parts = [];
        if (r.created) parts.push(plural(r.created, 'fiche créée', 'fiches créées'));

  const c = m.el.querySelector('[data-i="clash"]');
  if (c) { const n = clash(S.periode); c.textContent = n ? `${plural(n, 'relevé existe', 'relevés existent')} déjà pour le même compteur et le même mois : cochez pour les remplacer par ceux du fichier.` : 'aucun conflit avec les relevés déjà enregistrés'; }
}
async function applyImport(plan, opts) {
  const byKey = new Map([...S.fiches.values()].map(f => [ficheKey(f), f]));
  const touched = new Map();
  let created = 0, updated = 0, recNew = 0, recRepl = 0, recSkip = 0;
  const upsert = src => {
    const k = ficheKey(src);
    let f = touched.get(k);
    if (!f) {
      const old = byKey.get(k);
      if (old) {
        f = Object.assign({}, old);
        let changed = false;
        for (const x of FICHE_FIELDS) if (src[x] && (opts.overwrite || !f[x]) && f[x] !== src[x]) { f[x] = src[x]; changed = true; }
        if (changed) { updated++; f.updatedAt = nowISO(); }
      } else {
        f = { id: uid(), createdAt: nowISO(), updatedAt: nowISO(), gps: null };
        for (const x of FICHE_FIELDS) f[x] = src[x] || '';
        created++;
      }
      touched.set(k, f);
    } else {
      for (const x of FICHE_FIELDS) if (src[x] && !f[x]) f[x] = src[x];
    }
    return f;
  };
  plan.fiches.forEach(upsert);
  const recs = new Map();
  for (const r of plan.releves) {
    const f = upsert(r.fiche), periode = r.periode || opts.periode, id = recId(f.id, periode);
    if (S.releves.has(id) && !opts.replace) { recSkip++; continue; }
    if (S.releves.has(id)) recRepl++; else if (!recs.has(id)) recNew++;
    recs.set(id, { id, ficheId: f.id, periode, serie: r.fiche.serie || f.serie, date: r.date || addMonths(periode, 1) + '-01', v: cleanV(r.v), note: '', createdAt: nowISO(), savedAt: nowISO(), imported: true });
  }
  const ops = [];
  for (const f of touched.values()) ops.push(['put', 'fiches', f]);
  for (const rec of recs.values()) ops.push(['put', 'releves', rec]);
  if (ops.length && !(await commit(ops))) throw new Error("Enregistrement sur l'appareil impossible.");
  // Index précédents importés : conservés seulement s'ils diffèrent de la valeur calculée automatiquement.
  const fix = [];
  for (const id of recs.keys()) {
    const cur = S.releves.get(id);
    if (!cur) continue;
    const v = clone(cur.v);
    let changed = false;
    for (const code of Object.keys(v)) {
      if (isNum(v[code].p) && Math.abs(autoPrec(cur, code) - v[code].p) < 1e-9) { delete v[code].p; changed = true; }
    }
    if (changed) fix.push(['put', 'releves', Object.assign({}, cur, { v: cleanV(v) })]);
  }
  if (fix.length) await commit(fix);
  return { created, updated, recNew, recRepl, recSkip };
}

/* --- Sauvegarde / restauration --- */
function backupFile() {
  const d = new Date();
  const data = {
    app: 'releve-mt', format: 1, version: APP_VERSION, exportedAt: nowISO(), releveur: S.meta.get('releveur') || '',
    fiches: [...S.fiches.values()], releves: [...S.releves.values()], brouillons: [...S.drafts.values()], modele: S.meta.get('modele') || null,
  };
  return { blob: new Blob([JSON.stringify(data)], { type: 'application/json' }), name: `Releve MT - sauvegarde ${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}.json` };
}
async function restoreBackup(bytes, name) {
  let data;
  try { data = JSON.parse(decodeText(bytes)); } catch (e) { throw new Error('Fichier de sauvegarde illisible.'); }
  if (!data || data.app !== 'releve-mt' || !Array.isArray(data.fiches)) throw new Error("Ce fichier n'est pas une sauvegarde de Relevé MT.");
  const fiches = data.fiches.filter(f => f && f.id);
  const releves = (data.releves || []).filter(r => r && r.id && r.ficheId && isPer(r.periode));
  const drafts = (data.brouillons || []).filter(r => r && r.id && r.ficheId && isPer(r.periode));
  const ok = await confirmDialog({
    title: 'Restaurer la sauvegarde ?',
    body: `<p><b>${esc(name)}</b>${data.exportedAt ? ' — ' + new Date(data.exportedAt).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : ''}</p><p>${plural(fiches.length, 'fiche', 'fiches')}, ${plural(releves.length, 'relevé', 'relevés')}, ${plural(drafts.length, 'brouillon', 'brouillons')}.</p><p class="muted small">Les éléments identiques déjà présents sur cet appareil sont remplacés, les autres sont conservés.</p>`,
    ok: 'Restaurer',
  });
  if (!ok) return;
  const ops = [];
  fiches.forEach(f => ops.push(['put', 'fiches', f]));
  releves.forEach(r => ops.push(['put', 'releves', r]));
  drafts.forEach(r => ops.push(['put', 'brouillons', r]));
  if (data.releveur && !S.meta.get('releveur')) ops.push(['put', 'meta', { k: 'releveur', v: data.releveur }]);
  if (data.modele && data.modele.b64 && !S.meta.get('modele')) { ops.push(['put', 'meta', { k: 'modele', v: data.modele }]); TPL = null; }
  if (ops.length) await commit(ops);
  toast('Sauvegarde restaurée.', 'ok');
  render();
}
async function useCustomTemplate(file) {
  const bytes = new Uint8Array(await file.arrayBuffer());
  const info = { custom: true, name: file.name, date: new Date().toLocaleDateString('fr-FR') };
  await analyseTemplate(bytes, info);                      // refuse un fichier non conforme (message explicite)
  await setMeta('modele', { name: file.name, date: info.date, b64: bytesToB64(bytes) });
  TPL = null;
  toast(`Modèle « ${file.name} » utilisé pour les prochains exports.`, 'ok', { duration: 6000 });
  render();
}

const IS_WEB = /^https?:$/.test(location.protocol);
const UA = navigator.userAgent || '';
const IS_IOS = /iPhone|iPad|iPod/i.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IN_APP = /FBAN|FBAV|FB_IAB|Instagram|Line\/|LinkedInApp|Snapchat|MicroMessenger|; wv\)/i.test(UA);
const isStandalone = () => navigator.standalone === true || (!!window.matchMedia && ['standalone', 'fullscreen', 'minimal-ui'].some(m => matchMedia(`(display-mode: ${m})`).matches));
const appUrl = () => location.href.split('#')[0];

window.addEventListener('beforeinstallprompt', e => {

async function promptInstall() {

function registerSW() {
  if (!IS_WEB || !('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('./service-worker.js').catch(err => console.warn('Service worker non enregistré :', err));
}
function imgSize(blob) {
  return new Promise(resolve => {
    const u = URL.createObjectURL(blob), im = new Image();
    im.onload = () => { URL.revokeObjectURL(u); resolve({ w: im.naturalWidth, h: im.naturalHeight }); };
    im.onerror = () => { URL.revokeObjectURL(u); resolve(null); };
    im.src = u;
  });
}
async function probe(url, asImage) {
  try {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) return { ok: false, why: `introuvable sur le site (erreur ${r.status})` };
    if (!asImage) return { ok: true, res: r };
    const size = await imgSize(await r.blob());
    return size ? { ok: true, w: size.w, h: size.h } : { ok: false, why: "présent mais ce n'est pas une image lisible" };
  } catch (e) {
    return { ok: false, why: `inaccessible (${(e && e.message) || 'erreur réseau'})` };
  }
}
async function installReport() {
  const rows = [], add = (ok, label, detail = '') => rows.push({ ok, label, detail });
  add(true, `Version de l'application : ${APP_VERSION}`, 'Après une mise à jour sur GitHub, patientez 2 minutes puis rechargez la page.');
  if (!IS_WEB) { add(false, 'Ouverte depuis un fichier local', "L'installation exige une adresse https:// : publiez les fichiers sur GitHub Pages, puis ouvrez cette adresse sur le téléphone."); return rows; }
  const https = location.protocol === 'https:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  add(https, https ? 'Adresse sécurisée (https)' : 'Adresse non sécurisée (http)', https ? '' : "L'installation exige https:// (GitHub : Settings → Pages → Enforce HTTPS).");
  if (IN_APP) add(false, "Page ouverte dans le navigateur intégré d'une autre application", 'Ouvrez le lien dans Chrome (menu ⋮ → « Ouvrir dans Chrome »).');
  const link = $('link[rel="manifest"]'), murl = new URL(link ? link.getAttribute('href') : 'manifest.json', location.href).href;
  let man = null;
  const pm = await probe(murl);
  if (!pm.ok) add(false, `manifest.json ${pm.why}`, 'Envoyez manifest.json sur GitHub, au même endroit que index.html.');
  else { try { man = await pm.res.json(); add(true, 'manifest.json trouvé'); } catch (e) { add(false, 'manifest.json illisible', 'Fichier modifié ou tronqué : renvoyez la version fournie.'); } }
  if (man) {
    const disp = ['standalone', 'fullscreen', 'minimal-ui'].includes(man.display);
    add(!!(man.name || man.short_name) && !!man.start_url && disp, 'Manifeste complet (nom, page de départ, plein écran)', disp ? '' : `display = « ${man.display} » : « standalone » attendu.`);
    let has192 = false, has512 = false;
    for (const ic of Array.isArray(man.icons) ? man.icons : []) {
      const want = String(ic.sizes || '').split(/\s+/)[0];
      const r = await probe(new URL(ic.src, murl).href, true);
      const good = r.ok && `${r.w}x${r.h}` === want;
      if (good && (!ic.purpose || /any/.test(ic.purpose))) { if (want === '192x192') has192 = true; if (want === '512x512') has512 = true; }
      add(good, `Icône ${ic.src}`, good ? `${r.w} × ${r.h} px` : r.ok ? `taille ${r.w} × ${r.h} au lieu de ${want}` : `${r.why} : envoyez ce fichier sur GitHub, au même endroit que index.html.`);
    }
    add(has192 && has512, has192 && has512 ? 'Icônes 192 et 512 px disponibles' : 'Icônes 192 et 512 px manquantes', has192 && has512 ? '' : "Chrome refuse l'installation sans ces deux icônes.");
  }
  const ps = await probe(new URL('service-worker.js', location.href).href);
  add(ps.ok, ps.ok ? 'service-worker.js trouvé' : `service-worker.js ${ps.why}`, ps.ok ? '' : 'Envoyez service-worker.js au même endroit que index.html (fonctionnement hors ligne).');
  if ('serviceWorker' in navigator) {
    try {
      const reg = await navigator.serviceWorker.getRegistration();
      const on = !!(reg && reg.active);
      add(on ? true : null, on ? 'Mode hors ligne actif' : 'Mode hors ligne pas encore actif', on ? '' : 'Rechargez la page une fois.');
    } catch (e) { add(null, 'Mode hors ligne : vérification impossible'); }
  }
  if (isStandalone()) add(true, 'Vous utilisez la version installée');
  else if (S.installEvt) add(true, "Chrome propose l'installation", 'Touchez « Installer maintenant » en haut de cette page.');
  else if (IS_IOS) add(null, 'iPhone / iPad', "Safari → bouton Partager → « Sur l'écran d'accueil ».");
  else add(null, "Chrome n'a pas encore proposé l'installation", "Si tout est vert au-dessus : l'appli est peut-être déjà installée, la page est en navigation privée, ou le téléphone bloque l'installation (voir les solutions ci-dessus, dont le raccourci qui marche partout).");
  return rows;
}
async function runDiag() {
  if (!$('#diag')) return;
  $('#diag').innerHTML = '<p class="muted">Vérification en cours…</p>';
  const rows = await installReport();
  const box = $('#diag');
  if (!box) return;

  box.innerHTML = `<div class="banner ${bad ? 'danger' : 'ok'}">${icon(bad ? 'alert' : 'check')}<div><b>${bad ? `${plural(bad, 'point bloque', 'points bloquent')} l'installation` : 'Les fichiers sont en ordre'}</b>${bad ? 'Corrigez les lignes rouges (souvent un fichier non envoyé sur GitHub), attendez 2 minutes puis rechargez la page.' : 'Si Chrome refuse encore, suivez les solutions ci-dessus.'}</div></div>`
    + `<ul class="checks">${rows.map(r => `<li class="${r.ok === true ? 'ok' : r.ok === false ? 'ko' : 'warn'}"><span class="ck">${icon(r.ok === true ? 'check' : r.ok === false ? 'x' : 'alert')}</span><div><b>${esc(r.label)}</b>${r.detail ? `<small>${esc(r.detail)}</small>` : ''}</div></li>`).join('')}</ul>`
    + `<p class="muted small" style="margin-top:10px;overflow-wrap:anywhere">Adresse vérifiée : ${esc(appUrl())}</p>`;
}
// Vérification automatique (une fois par ouverture) : signale tout de suite un fichier manquant sur le site.
function autoInstallCheck() {
  if (!IS_WEB || isStandalone()) return;
  setTimeout(async () => {
    if (S.installEvt || isStandalone()) return;
    const bad = (await installReport()).filter(r => r.ok === false);
    if (bad.length) toast(`Installation impossible : ${bad[0].label}.`, 'error', { duration: 0, action: { label: 'Détails', fn: () => go('#/installer') } });
  }, 6000);
}

   9. Navigation (adresses #/…) et actions
   ===================================================================== */
function parseRoute() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(s => { try { return decodeURIComponent(s); } catch (e) { return s; } });
  switch (parts[0]) {
    case 'fiche': return parts[2] === 'modifier' ? { name: 'ficheForm', id: parts[1] } : { name: 'fiche', id: parts[1] };
    case 'nouveau': return { name: 'ficheForm', id: null };
    case 'releve': return { name: 'saisie', id: parts[1], periode: parts[2] };
    case 'parametres': return { name: 'params' };
    case 'installer': return { name: 'install' };
    default: return { name: 'home' };
  }
}
function go(hash, replace) {
  if (location.hash === hash || (hash === '#/' && !location.hash)) { onRoute(true); return; }
  S.navByApp = true;
  if (replace) location.replace(hash);
  else { S.depth++; location.hash = hash; }
}
function goHome() {
  if (S.depth > 0) { const n = S.depth; S.depth = 0; S.navByApp = true; S.wantHome = true; history.go(-n); }
  else go('#/', true);
}
function back(fallback) {
  if (S.depth > 0) { S.depth--; S.navByApp = true; history.back(); }
  else go(fallback || '#/', true);
}
function parentOf(r) {
  if (r.name === 'saisie' || (r.name === 'ficheForm' && r.id)) return '#/fiche/' + encodeURIComponent(r.id);
  return '#/';
}
function onRoute(same) {
  if (same !== true) {
    if (!S.navByApp) S.depth = Math.max(0, S.depth - 1);     // retour arrière du téléphone ou du navigateur
    S.navByApp = false;
  }
  const prev = S.route, next = parseRoute();
  if (S.wantHome) {                                          // retour à la tournée demandé : on s'y assure d'arriver
    S.wantHome = false;
    if (next.name !== 'home') { S.navByApp = true; location.replace('#/'); return; }
  }
  if (prev.name === 'saisie' && !(next.name === 'saisie' && next.id === prev.id && next.periode === prev.periode)) leaveEntry();
  closeModals();
  S.route = next;
  render();
  window.scrollTo(0, 0);
}
function render() {
  const r = S.route;
  let html;
  try {
    html = r.name === 'fiche' ? vFiche(r) : r.name === 'ficheForm' ? vFicheForm(r) : r.name === 'saisie' ? vSaisie(r)
      : r.name === 'params' ? vParams() : r.name === 'install' ? vInstall() : vHome();
  } catch (e) {
    console.error(e);
    html = `${subBar('Erreur', '')}<main class="page"><div class="banner danger">${icon('alert')}<div><b>Affichage impossible</b>${esc(e.message)}</div></div><button type="button" class="btn primary" data-act="home">Retour à l'accueil</button></main>`;
  }
  $('#app').innerHTML = html;
  if (r.name === 'install') runDiag();
}

    const f = S.fiches.get(el.dataset.id);
    if (!f) return;
    try { deliver(await exportHistoryFile(f), 'Historique exporté'); } catch (e) { errorDialog('Export impossible', e); }
  },
  import: () => { closeModals(); pickFile('import', '.xlsx,.xlsm,.csv,.json,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv,application/json'); },
  blank: async () => { closeModals(); try { deliver(await exportBlankFile(), 'Modèle vierge'); } catch (e) { errorDialog('Téléchargement impossible', e); } },
  backup: () => { deliver(backupFile(), 'Sauvegarde'); setMeta('lastBackup', nowISO()).then(() => { if (S.route.name === 'params') render(); }); },
  restore: () => pickFile('restore', '.json,application/json'),
  'tpl-custom': () => pickFile('modele', '.xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'),
  'tpl-reset': async () => { await commit([['del', 'meta', 'modele']]); TPL = null; toast('Modèle intégré RELEVE MT.xlsx rétabli.', 'ok'); render(); },
  'go-params': () => go('#/parametres'),
  'go-install': () => go('#/installer'),
  install: () => promptInstall(),
  diag: () => runDiag(),
  'copy-url': () => copyText(appUrl()),
  wipe: () => wipeAll(),
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  Promise.resolve(fn(el, e)).catch(err => { console.error(err); errorDialog('Action impossible', err); });
});
document.addEventListener('input', e => {
  const t = e.target, k = t.dataset && t.dataset.in;
  if (!k) return;
  if (k === 'act' || k === 'prec') onNumInput(t);
  else if (k === 'date') { if (S.work) { S.work.date = t.value; markDirty(); } }
  else if (k === 'search') { S.search = t.value; const l = $('#list'); if (l) l.innerHTML = listHTML(); toggleClear(); }
  else if (k === 'releveur') saveReleveur(t.value);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modals.length) { modals[modals.length - 1].close(); return; }
  if (e.key !== 'Enter') return;
  const t = e.target;
  if (t.id === 'q') { t.blur(); return; }
  if (!t.matches || !t.matches('input.num')) return;
  e.preventDefault();
  if (S.mode === 'guide' && t.dataset.in === 'act') { guideMove(1); return; }
  const inputs = $$('#entry-body input.num'), i = inputs.indexOf(t);
  const next = inputs.slice(i + 1).find(x => x.dataset.in === 'act');
  if (next) { next.focus(); next.select(); } else t.blur();
});
$('#file-in').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const purpose = e.target.dataset.purpose;
  try {
    if (purpose === 'modele') await useCustomTemplate(file);
    else if (purpose === 'restore') await restoreBackup(new Uint8Array(await file.arrayBuffer()), file.name);
    else await importFile(file);
  } catch (err) {
    console.error(err);
    errorDialog(purpose === 'modele' ? 'Modèle refusé' : 'Import impossible', err);
  }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveDraftNow(); });
window.addEventListener('pagehide', () => saveDraftNow());
window.addEventListener('afterprint', () => { $('#print-root').innerHTML = ''; });

/* =====================================================================
   10. Démarrage
   ===================================================================== */
const STORES = [['fiches', 'fiches'], ['releves', 'releves'], ['brouillons', 'drafts'], ['meta', 'meta']];
async function loadAll(keepMemory) {
  const data = await Promise.all(STORES.map(([s]) => DB.all(s)));
  STORES.forEach(([s, key], i) => {
    for (const x of data[i]) {
      const id = s === 'meta' ? x.k : x.id;
      if (keepMemory && S[key].has(id)) continue;          // la saisie faite entre-temps l'emporte
      S[key].set(id, s === 'meta' ? x.v : x);
    }
  });
}
// La base a répondu après le délai de garde : on recharge ses données et on y écrit les saisies faites entre-temps.
DB.onLate = async () => {
  try {
    await loadAll(true);
    indexReleves();
    const ops = [];
    STORES.forEach(([s, key]) => { for (const [id, v] of S[key]) ops.push(['put', s, s === 'meta' ? { k: id, v } : v]); });
    S.storageOk = true;
    await DB.write(ops);
    if (S.route.name === 'home' || S.route.name === 'params') render();
    toast('Stockage de l’appareil de nouveau disponible : données enregistrées.', 'ok');
  } catch (e) { console.warn(e); }
};
async function start() {
  try {
    await DB.open();
    await loadAll(false);
  } catch (e) {
    console.warn('Stockage indisponible :', e);
    S.storageOk = false;
  }
  indexReleves();
  const sp = ssGet('periode', null);
  S.periode = isPer(sp) ? sp : defaultPeriod();
  S.mode = lsGet('mode', 'grille') === 'guide' ? 'guide' : 'grille';
  S.gorder = lsGet('gorder', 'n') === 'grille' ? 'grille' : 'n';
  S.route = parseRoute();
  window.addEventListener('hashchange', () => onRoute());
  render();
  registerSW();
  autoInstallCheck();
}
start();
})();
</script>
